[project]
name = "payflow-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-adk>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-auth>=2.35",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "google-cloud-firestore>=2.19",
    "payflow-backend",
]

[tool.uv.sources]
payflow-backend = { git = "https://github.com/park-song-jungyujin/payflow-backend", rev = "v0.1.0" }
