name: Deploy payflow-agent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # WIF — 키 없이 이 토큰으로 GCP에 인증한다

env:
  PROJECT_ID: payflow-hackathon-2026
  REGION: asia-northeast3
  # backend/infra의 terraform output ci_agent_workload_identity_provider / ci_agent_deployer_service_account
  WIF_PROVIDER: projects/1095757595735/locations/global/workloadIdentityPools/github-actions/providers/payflow-agent
  DEPLOY_SA: payflow-agent-deployer@payflow-hackathon-2026.iam.gserviceaccount.com
  RUNTIME_SA: payflow-agent@payflow-hackathon-2026.iam.gserviceaccount.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync

      - run: uv run pytest

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: |
          gcloud run deploy payflow-agent \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --service-account "$RUNTIME_SA" \
            --quiet
